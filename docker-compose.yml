services:
  averis:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Averis Veritas"
      APP_VERSION: "0.1.0"
      DATA_SOURCE: "/app"
      DATABASE_URL: "sqlite:////app/averis.db"
      UPLOAD_DIR: "/app/uploads"
      OCR_PROVIDER: "${OCR_PROVIDER:-openai}"
      OCR_LANG: "${OCR_LANG:-en}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_OCR_MODEL: "${OPENAI_OCR_MODEL:-gpt-5.5}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      DEEPSEEK_TIMEOUT_SECONDS: "${DEEPSEEK_TIMEOUT_SECONDS:-20}"
